# Netlify build configuration for the Al Rahman Enterprises site.
# Netlify detects Next.js and applies its Next.js Runtime automatically, so the
# plugin must NOT be declared here as well.

[build]
  command = "prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for hashed build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Prisma's generated client and query engine must ship with the functions.
[functions]
  included_files = ["node_modules/.prisma/client/**", "node_modules/@prisma/client/**"]
